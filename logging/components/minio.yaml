# Deploy minio, does not require an operator.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
# Example secret, copy to client namespace.
apiVersion: v1
kind: Secret
metadata:
  name: minio
  namespace: minio
stringData:
  access_key_id: minio
  access_key_secret: minio123
  bucketnames: loki
  endpoint: http://minio.minio.svc:9000
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  ports:
  - port: 9000
    protocol: TCP
    targetPort: 9000
  selector:
    app.kubernetes.io/name: minio
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: minio
  name: minio
  namespace: minio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      # quay.io/minio/minio is access-restricted (unauthorized even with a
      # valid quay login); quay.io/minio/aistor/minio is MinIO's publicly
      # pullable publish of the same server. It has no shell (ubi9-micro), so
      # an initContainer pre-creates the loki bucket the Loki operator
      # expects. Non-root: OpenShift SCCs allocate the pod UID/fsGroup from
      # namespace ranges, so none is pinned here.
      initContainers:
      - name: create-bucket
        image: registry.access.redhat.com/ubi9/ubi-minimal:9.6
        command:
        - /bin/sh
        - -c
        - mkdir -p /storage/loki
        volumeMounts:
        - mountPath: /storage
          name: storage
      containers:
      - args:
        - server
        - /storage
        env:
        - name: MINIO_ROOT_USER
          value: minio
        - name: MINIO_ROOT_PASSWORD
          value: minio123
        image: quay.io/minio/aistor/minio:latest
        name: minio
        ports:
        - containerPort: 9000
        volumeMounts:
        - mountPath: /storage
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: minio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: minio
  name: minio
  namespace: minio
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi